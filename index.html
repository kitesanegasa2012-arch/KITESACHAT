<!DOCTYPE html>
<html lang="om" class="h-full light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchat - Telegram Clone</title>

    <!-- Manifest sirreeffame: Icoonii fi halluu sirrii -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Kitchat","short_name":"Kitchat","description":"Realtime Messenger","start_url":"./","display":"standalone","background_color":"%2316a34a","theme_color":"%2316a34a","icons":[{"src":"https://ui-avatars.com/api/?name=Kitchat&background=16a34a&color=fff&size=192&font-size=0.33","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"https://ui-avatars.com/api/?name=Kitchat&background=16a34a&color=fff&size=512&font-size=0.33","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <style>
        * { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f7f0; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .app-container { height: 100vh; width: 100%; max-width: 420px; background: #ffffff; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: #f8fafc; z-index: 50; }
        .screen.active { display: flex; }
        
        /* Chat Styles */
        .msg-bubble { max-width: 80%; padding: 8px 12px; border-radius: 18px; font-size: 0.95rem; word-break: break-word; margin-bottom: 4px; position: relative; }
        .msg-outgoing { background: #dcf8c6; color: #000; border-bottom-right-radius: 4px; margin-left: auto; }
        .msg-incoming { background: #ffffff; color: #000; border-bottom-left-radius: 4px; margin-right: auto; }
        .msg-time { font-size: 0.65rem; color: #888; float: right; margin-left: 8px; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        
        /* Bottom Navigation */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 8px 0; z-index: 40; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 0.75rem; cursor: pointer; padding: 4px 12px; border-radius: 8px; }
        .nav-item.active { color: #16a34a; background: #f0fdf4; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; }
    </style>
</head>
<body class="h-full light">
    <div class="app-container">
        
        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="screen active px-6 py-10 justify-center items-center bg-white" style="z-index: 100;">
            <div class="w-20 h-20 rounded-3xl bg-[#16a34a] flex items-center justify-center text-white text-4xl mb-6 shadow-lg">
                <i class="fas fa-comment-dots"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Baga nagaan dhuftan Kitchat</h1>
            <p class="text-gray-500 text-sm mb-8 text-center">Qunnamtii real-time, saffisaa fi salphaa.</p>
            <button id="googleSignInBtn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-xl py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition shadow-sm">
                <i class="fab fa-google text-red-500"></i> Gmail fayyadamuun seeni
            </button>
        </div>

        <!-- MAIN CHATS LIST SCREEN -->
        <div id="chatsScreen" class="screen">
            <header class="bg-[#16a34a] px-4 py-3 flex items-center justify-between shadow-sm z-10">
                <h1 class="text-white font-semibold text-xl">Kitchat</h1>
            </header>
            <div id="userList" class="flex-1 overflow-y-auto bg-white pb-20">
                <div class="p-4 text-center text-gray-500">Namoota galmaa'an barbaadaa jira...</div>
            </div>
            <div class="bottom-nav">
                <div class="nav-item active" onclick="switchTab('chats')"><i class="fas fa-comment"></i>Chats</div>
                <div class="nav-item" onclick="switchTab('contacts')"><i class="fas fa-user"></i>Contacts</div>
                <div class="nav-item" onclick="switchTab('profile')"><i class="fas fa-user-circle"></i>Profile</div>
            </div>
        </div>

        <!-- CONTACTS SCREEN -->
        <div id="contactsScreen" class="screen">
            <header class="bg-[#16a34a] px-4 py-3 flex items-center justify-between shadow-sm z-10">
                <h1 class="text-white font-semibold text-xl">Contacts</h1>
            </header>
            <div id="contactsList" class="flex-1 overflow-y-auto bg-white pb-20">
                <div class="p-4 text-center text-gray-500">Namoota galmaa'an barbaadaa jira...</div>
            </div>
            <div class="bottom-nav">
                <div class="nav-item" onclick="switchTab('chats')"><i class="fas fa-comment"></i>Chats</div>
                <div class="nav-item active" onclick="switchTab('contacts')"><i class="fas fa-user"></i>Contacts</div>
                <div class="nav-item" onclick="switchTab('profile')"><i class="fas fa-user-circle"></i>Profile</div>
            </div>
        </div>

        <!-- PROFILE SCREEN -->
        <div id="profileScreen" class="screen">
            <header class="bg-[#16a34a] px-4 py-3 flex items-center justify-between shadow-sm z-10">
                <h1 class="text-white font-semibold text-xl">Profile</h1>
                <button onclick="logout()" class="text-white text-lg"><i class="fas fa-sign-out-alt"></i></button>
            </header>
            <div class="flex-1 overflow-y-auto bg-gray-50 pb-20">
                <div class="bg-white flex flex-col items-center py-6 px-4 mb-3 shadow-sm">
                    <img id="profilePic" src="https://ui-avatars.com/api/?name=User&background=16a34a&color=fff&size=128" class="w-24 h-24 rounded-full object-cover mb-3 border-4 border-green-100">
                    <h2 id="profileName" class="text-xl font-bold text-gray-800">Loading...</h2>
                    <p id="profileEmail" class="text-gray-500 text-sm">Loading...</p>
                </div>
            </div>
            <div class="bottom-nav">
                <div class="nav-item" onclick="switchTab('chats')"><i class="fas fa-comment"></i>Chats</div>
                <div class="nav-item" onclick="switchTab('contacts')"><i class="fas fa-user"></i>Contacts</div>
                <div class="nav-item active" onclick="switchTab('profile')"><i class="fas fa-user-circle"></i>Profile</div>
            </div>
        </div>

        <!-- CHAT ROOM SCREEN -->
        <div id="chatRoomScreen" class="screen">
            <header class="bg-[#16a34a] px-4 py-2 flex items-center justify-between shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <button onclick="closeChatRoom()" class="text-white text-lg"><i class="fas fa-arrow-left"></i></button>
                    <img id="chatAvatar" src="" class="w-9 h-9 rounded-full object-cover">
                    <div>
                        <h2 id="chatName" class="text-white font-semibold text-md leading-tight">Name</h2>
                        <p id="chatStatus" class="text-[#dcfce7] text-xs">online</p>
                    </div>
                </div>
            </header>
            
            <div id="chatMessages" class="flex-1 overflow-y-auto px-4 py-4 bg-[#e5ddd5] flex flex-col pb-20">
                <!-- Messages injected here -->
            </div>

            <!-- Input Bar -->
            <div class="bg-gray-100 border-t border-gray-200 px-2 py-2 flex items-center gap-2 absolute bottom-0 w-full z-40">
                <button onclick="document.getElementById('fileInput').click()" class="text-gray-500 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200">
                    <i class="fas fa-paperclip text-lg"></i>
                </button>
                <input type="file" id="fileInput" class="hidden" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" onchange="uploadFile(event)">
                
                <input id="messageInput" type="text" placeholder="Message..." class="flex-1 bg-white rounded-full px-4 py-2 text-sm outline-none border border-gray-300">
                <button id="sendButton" class="w-10 h-10 rounded-full bg-[#16a34a] text-white flex items-center justify-center shadow-sm">
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIGURATION
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCraTczVNl2oBTDp531KHyu6cINac37nhE",
            authDomain: "kitchat-6dd20.firebaseapp.com",
            databaseURL: "https://kitchat-6dd20-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kitchat-6dd20",
            storageBucket: "kitchat-6dd20.firebasestorage.app",
            messagingSenderId: "830131023971",
            appId: "1:830131023971:web:b694c059bfb978bb3b0856"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();

        let currentUser = null;
        let currentChatId = null;
        let messagesListener = null;

        // ============================================================
        // AUTH & SCREEN NAVIGATION
        // ============================================================
        document.getElementById('googleSignInBtn').addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                alert('Dogoggora seenuu: ' + error.message);
            }
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').classList.remove('active');
                switchTab('chats');
                
                // Save User to Database
                db.ref('users/' + user.uid).set({
                    name: user.displayName || 'User',
                    email: user.email,
                    photoURL: user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName}&background=random`
                });

                // Profile Screen Info
                document.getElementById('profileName').textContent = user.displayName || 'User';
                document.getElementById('profileEmail').textContent = user.email;
                if(user.photoURL) document.getElementById('profilePic').src = user.photoURL;

                loadUsers();
            } else {
                currentUser = null;
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('loginScreen').classList.add('active');
            }
        });

        function logout() { auth.signOut(); }

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if (tab === 'chats') {
                document.getElementById('chatsScreen').classList.add('active');
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            } else if (tab === 'contacts') {
                document.getElementById('contactsScreen').classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            } else if (tab === 'profile') {
                document.getElementById('profileScreen').classList.add('active');
                document.querySelectorAll('.nav-item')[2].classList.add('active');
            }
        }

        // ============================================================
        // LOAD USERS (Contacts & Chats List)
        // ============================================================
        function loadUsers() {
            db.ref('users').on('value', (snapshot) => {
                const users = snapshot.val();
                const chatsList = document.getElementById('userList');
                const contactsList = document.getElementById('contactsList');
                
                // Clear lists but keep loading text if needed
                chatsList.innerHTML = '';
                contactsList.innerHTML = '';

                let userCount = 0;

                for (const uid in users) {
                    if (uid === currentUser.uid) continue; // Skip self
                    userCount++;
                    const u = users[uid];
                    
                    const userHTML = `
                        <div onclick="openChat('${uid}', '${u.name}', '${u.photoURL}')" class="flex items-center gap-3 p-3 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition">
                            <img src="${u.photoURL}" class="w-12 h-12 rounded-full object-cover border border-gray-200">
                            <div class="flex-1">
                                <h3 class="font-semibold text-gray-800">${u.name}</h3>
                                <p class="text-xs text-gray-500">Tap to chat</p>
                            </div>
                            <i class="fas fa-comment-dots text-green-500"></i>
                        </div>
                    `;
                    chatsList.innerHTML += userHTML;
                    contactsList.innerHTML += userHTML;
                }

                if (userCount === 0) {
                    chatsList.innerHTML = '<div class="p-4 text-center text-gray-500">Ammaaf namni biraa hin seenne. Nama biraa akka seenuuf bilbila biraa fayyadami.</div>';
                    contactsList.innerHTML = '<div class="p-4 text-center text-gray-500">Ammaaf namni biraa hin seenne.</div>';
                }
            });
        }

        // ============================================================
        // CHAT ROOM LOGIC
        // ============================================================
        function openChat(uid, name, photo) {
            // Generate consistent Chat ID (sorted UIDs)
            currentChatId = currentUser.uid > uid ? currentUser.uid + "_" + uid : uid + "_" + currentUser.uid;

            document.getElementById('chatName').textContent = name;
            document.getElementById('chatAvatar').src = photo;
            
            document.getElementById('chatsScreen').classList.remove('active');
            document.getElementById('chatRoomScreen').classList.add('active');

            loadMessages();
        }

        function closeChatRoom() {
            document.getElementById('chatRoomScreen').classList.remove('active');
            switchTab('chats');
            currentChatId = null;
            if(messagesListener) {
                db.ref('chats/' + currentChatId + '/messages').off('child_added', messagesListener);
            }
        }

        function loadMessages() {
            const chatMessagesDiv = document.getElementById('chatMessages');
            chatMessagesDiv.innerHTML = '';
            
            // Detach old listener
            if (messagesListener) db.ref('chats/' + currentChatId + '/messages').off();

            // Listen for new messages
            messagesListener = db.ref('chats/' + currentChatId + '/messages').limitToLast(100).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                renderMessage(msg, snapshot.key);
            });
        }

        function renderMessage(msg, msgId) {
            const chatMessagesDiv = document.getElementById('chatMessages');
            const isOut = msg.senderId === currentUser.uid;
            
            const div = document.createElement('div');
            div.className = `flex ${isOut ? 'justify-end' : 'justify-start'} mb-1`;
            div.setAttribute('data-msg-id', msgId);

            let contentHTML = '';
            
            // Render based on type
            if (msg.type === 'text') {
                contentHTML = `<p class="text-[15px]">${msg.text}</p>`;
            } else if (msg.type === 'image') {
                contentHTML = `<img src="${msg.url}" class="max-w-[200px] rounded-lg mb-1 cursor-pointer" onclick="window.open('${msg.url}')">`;
            } else if (msg.type === 'video') {
                contentHTML = `<video src="${msg.url}" controls class="max-w-[200px] rounded-lg mb-1"></video>`;
            } else if (msg.type === 'audio') {
                contentHTML = `<audio src="${msg.url}" controls class="max-w-[200px] mb-1"></audio>`;
            } else if (msg.type === 'file') {
                contentHTML = `<a href="${msg.url}" target="_blank" class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg text-blue-600 text-sm mb-1"><i class="fas fa-file-alt text-lg"></i> Download File</a>`;
            }

            // Checkmarks for Read/Delivered
            let checkmarks = '';
            if (isOut) {
                checkmarks = msg.read ? 
                    `<i class="fas fa-check-double text-[#34b7f1] text-[12px]"></i>` : 
                    `<i class="fas fa-check text-gray-500 text-[12px]"></i>`;
            }

            div.innerHTML = `
                <div class="msg-bubble ${isOut ? 'msg-outgoing' : 'msg-incoming'}">
                    ${contentHTML}
                    <span class="msg-time">${msg.time} ${checkmarks}</span>
                </div>
            `;
            
            chatMessagesDiv.appendChild(div);
            chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;

            // Mark as read if incoming and unread
            if (!isOut && !msg.read) {
                db.ref('chats/' + currentChatId + '/messages/' + msgId).update({ read: true });
            }
        }

        // ============================================================
        // SENDING TEXT & FILES
        // ============================================================
        document.getElementById('sendButton').addEventListener('click', sendTextMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        function sendTextMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            const msgData = {
                senderId: currentUser.uid,
                text: text,
                type: 'text',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                read: false
            };

            db.ref('chats/' + currentChatId + '/messages').push(msgData);
            input.value = '';
        }

        async function uploadFile(event) {
            const file = event.target.files[0];
            if (!file || !currentChatId) return;

            // Alert user that upload started
            alert("Faayiliin olkaa'amaa jira... Maaloo eegaa.");

            const storageRef = storage.ref('chat_files/' + Date.now() + '_' + file.name);
            
            try {
                const snapshot = await storageRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();
                
                let type = 'file';
                if (file.type.startsWith('image/')) type = 'image';
                else if (file.type.startsWith('video/')) type = 'video';
                else if (file.type.startsWith('audio/')) type = 'audio';

                const msgData = {
                    senderId: currentUser.uid,
                    url: downloadURL,
                    fileName: file.name,
                    type: type,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    read: false
                };

                db.ref('chats/' + currentChatId + '/messages').push(msgData);
            } catch (error) {
                alert("Dogoggora faayilii erguu: " + error.message + "\nMirkaneessi Firebase Storage kee dandeessifameera.");
            }
            event.target.value = ''; // Reset input
        }
    </script>
</body>
</html>

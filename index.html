<!DOCTYPE html>
<html lang="om" class="h-full light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchat - Appii Qunnamtii Real-time</title>

    <!-- Manifest sirreessee: Icon PNG 192 fi 512 of keessatti qabata -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Kitchat","short_name":"Kitchat","description":"Kitchat Realtime Messenger","start_url":"./","display":"standalone","background_color":"%2316a34a","theme_color":"%2316a34a","icons":[{"src":"https://ui-avatars.com/api/?name=K&background=16a34a&color=fff&size=192","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"https://ui-avatars.com/api/?name=K&background=16a34a&color=fff&size=512","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (v9 compat mode - kan import hin barbaachifne) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        * { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f7f0; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .app-container { height: 100vh; width: 100%; max-width: 420px; background: #ffffff; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.05); position: relative; overflow: hidden; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
        .chat-messages { scrollbar-width: thin; scrollbar-color: #cbd5e0 #f7fafc; }
        .msg-bubble { max-width: 80%; padding: 10px 16px; border-radius: 24px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .msg-outgoing { background: #16a34a; color: white; border-bottom-right-radius: 6px; margin-left: auto; }
        .msg-incoming { background: #f1f5f9; color: #0f172a; border-bottom-left-radius: 6px; margin-right: auto; }
        .msg-meta { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; display: flex; justify-content: flex-end; gap: 6px; }
        .msg-outgoing .msg-meta { color: rgba(255,255,255,0.8); }
        .msg-incoming .msg-meta { color: #64748b; }
        .fade-enter { animation: fadeSlide 0.2s ease-out; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }
    </style>
</head>
<body class="h-full light">
    <div class="app-container">
        
        <!-- ================= LOGIN SCREEN ================= -->
        <div id="loginScreen" class="screen active px-6 py-10 justify-center items-center bg-white">
            <div class="w-20 h-20 rounded-3xl bg-[#16a34a] flex items-center justify-center text-white text-4xl mb-6 shadow-lg">
                <i class="fas fa-comment-dots"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Baga nagaan dhuftan Kitchat</h1>
            <p class="text-gray-500 text-sm mb-8 text-center">Qunnamtii real-time, saffisaa fi salphaa.</p>

            <!-- Phone Auth (Yoo Spark plan irra jirtu hin hojjetu, Gmail qofa fayyadami) -->
            <div class="w-full mb-4">
                <label class="block text-gray-600 text-sm font-medium mb-1">Lakkoofsa Bilbilaa</label>
                <div class="flex gap-2">
                    <input id="phoneNumber" type="tel" placeholder="+251911234567" class="flex-1 bg-gray-100 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#16a34a]/30 border border-transparent focus:border-[#16a34a]/30">
                    <button id="sendOtpBtn" class="bg-[#16a34a] text-white px-4 rounded-xl text-sm font-medium hover:bg-[#15803d] transition">Ergi</button>
                </div>
            </div>

            <!-- OTP Verification -->
            <div id="otpSection" class="w-full mb-4 hidden">
                <label class="block text-gray-600 text-sm font-medium mb-1">Koodii Mirkaneessaa (OTP)</label>
                <div class="flex gap-2">
                    <input id="otpCode" type="text" placeholder="123456" class="flex-1 bg-gray-100 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#16a34a]/30 border border-transparent focus:border-[#16a34a]/30">
                    <button id="verifyOtpBtn" class="bg-[#16a34a] text-white px-4 rounded-xl text-sm font-medium hover:bg-[#15803d] transition">Mirkaneessi</button>
                </div>
                <div id="recaptcha-container" class="mt-2"></div>
            </div>

            <div class="flex items-center w-full my-4">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="px-3 text-gray-400 text-xs">ykn</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <!-- Google Sign-In -->
            <button id="googleSignInBtn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-xl py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                <i class="fab fa-google text-red-500"></i> Gmail fayyadamuun seeni
            </button>

            <p class="text-xs text-gray-400 mt-8 text-center">Kitchat Realtime Messenger by Kitesa Negasa</p>
        </div>

        <!-- ================= CHAT SCREEN ================= -->
        <div id="chatScreen" class="screen">
            <header class="bg-[#16a34a] px-4 py-3 flex items-center justify-between shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white text-xl">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <div>
                        <h1 class="text-white font-semibold text-lg leading-tight">Kitchat</h1>
                        <p id="userStatus" class="text-[#dcfce7] text-xs font-medium flex items-center gap-1">
                            <span class="inline-block w-2 h-2 bg-emerald-300 rounded-full"></span>
                            <span id="userDisplayName">Online</span>
                        </p>
                    </div>
                </div>
                <div class="flex gap-4 text-white/90 text-lg">
                    <button id="logoutBtn" class="hover:text-white transition" title="Ba'i"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>

            <div id="chatContainer" class="flex-1 overflow-y-auto px-4 py-4 chat-messages bg-[#f8fafc] flex flex-col gap-2">
                <!-- Messages injected here -->
            </div>

            <footer class="bg-white border-t border-gray-100 px-3 py-2 flex items-center gap-2">
                <input id="messageInput" type="text" placeholder="Fakkii... (Message)" 
                       class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#16a34a]/30 transition border border-transparent focus:border-[#16a34a]/30">
                <button id="sendButton" class="w-10 h-10 rounded-full bg-[#16a34a] text-white flex items-center justify-center shadow-sm hover:bg-[#15803d] transition active:scale-95">
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </footer>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIGURATION (Koodii suuraa kee irraa waraabame)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCraTczVNI2oBTDp531KHyu6cINac37nhE",
            authDomain: "kitchat-6dd20.firebaseapp.com",
            projectId: "kitchat-6dd20",
            storageBucket: "kitchat-6dd20.firebasestorage.app",
            messagingSenderId: "830131023971",
            appId: "1:830131023971:web:b694c059bfb978bb3b0856",
            measurementId: "G-HCB3W42NJV"
        };

        // Initialize Firebase (compat mode)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // DOM Elements
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const otpSection = document.getElementById('otpSection');
        const otpCodeInput = document.getElementById('otpCode');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const userDisplayName = document.getElementById('userDisplayName');

        let currentUser = null;
        let recaptchaVerifier = null;
        let confirmationResult = null;
        let messagesRef = null;

        // ============================================================
        // AUTH STATE LISTENER
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.remove('active');
                chatScreen.classList.add('active');
                
                // Display user name or phone
                if (user.displayName) {
                    userDisplayName.textContent = user.displayName;
                } else if (user.phoneNumber) {
                    userDisplayName.textContent = user.phoneNumber;
                } else {
                    userDisplayName.textContent = user.email || 'User';
                }

                // Load messages
                loadMessages();
            } else {
                currentUser = null;
                loginScreen.classList.add('active');
                chatScreen.classList.remove('active');
                chatContainer.innerHTML = '';
                if (messagesRef) {
                    messagesRef.off();
                    messagesRef = null;
                }
            }
        });

        // ============================================================
        // PHONE AUTHENTICATION (Yoo Spark plan jirtu, kun hin hojjetu)
        // ============================================================
        function initRecaptcha() {
            if (!recaptchaVerifier) {
                recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                    'size': 'invisible',
                    'callback': (response) => {}
                });
                recaptchaVerifier.render();
            }
        }

        sendOtpBtn.addEventListener('click', async () => {
            const phoneNumber = phoneNumberInput.value.trim();
            if (!phoneNumber) {
                alert('Maaloo lakkoofsa bilbilaa galchi.');
                return;
            }

            initRecaptcha();

            try {
                sendOtpBtn.disabled = true;
                sendOtpBtn.textContent = 'Ergaa jira...';
                
                confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, recaptchaVerifier);
                
                otpSection.classList.remove('hidden');
                sendOtpBtn.textContent = 'Ergi';
                sendOtpBtn.disabled = false;
                alert('Koodiin mirkaneessaa ergameera. Bilbila kee ilaali.');
            } catch (error) {
                console.error('Phone auth error:', error);
                alert('Dogoggora: ' + error.message + ' (Yoo Spark plan irra jirtu, Phone Auth hin hojjetu. Gmail fayyadami.)');
                sendOtpBtn.textContent = 'Ergi';
                sendOtpBtn.disabled = false;
                if (recaptchaVerifier) {
                    recaptchaVerifier.clear();
                    recaptchaVerifier = null;
                }
            }
        });

        verifyOtpBtn.addEventListener('click', async () => {
            const code = otpCodeInput.value.trim();
            if (!code || !confirmationResult) {
                alert('Maaloo koodii mirkaneessaa galchi.');
                return;
            }

            try {
                verifyOtpBtn.disabled = true;
                verifyOtpBtn.textContent = 'Mirkaneessaa jira...';
                await confirmationResult.confirm(code);
            } catch (error) {
                console.error('OTP verification error:', error);
                alert('Koodiin dogoggoraa dha. Irra deebi\'ii yaali.');
                verifyOtpBtn.textContent = 'Mirkaneessi';
                verifyOtpBtn.disabled = false;
            }
        });

        // ============================================================
        // GOOGLE SIGN-IN
        // ============================================================
        googleSignInBtn.addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                console.error('Google sign-in error:', error);
                alert('Dogoggora seenuu Gmail: ' + error.message);
            }
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        logoutBtn.addEventListener('click', () => {
            auth.signOut();
        });

        // ============================================================
        // REALTIME DATABASE - MESSAGES
        // ============================================================
        function loadMessages() {
            if (messagesRef) messagesRef.off();
            
            messagesRef = database.ref('messages');
            
            messagesRef.limitToLast(100).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const msgId = snapshot.key;
                renderMessage(msg, msgId);
            });
        }

        function renderMessage(msg, msgId) {
            if (document.querySelector(`[data-msg-id="${msgId}"]`)) return;
            
            const isOut = msg.senderId === currentUser.uid;
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `flex ${isOut ? 'justify-end' : 'justify-start'} fade-enter`;
            bubbleDiv.setAttribute('data-msg-id', msgId);

            const innerDiv = document.createElement('div');
            innerDiv.className = `msg-bubble ${isOut ? 'msg-outgoing' : 'msg-incoming'}`;

            if (!isOut && msg.senderName) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'text-xs font-semibold text-[#16a34a] mb-1';
                nameDiv.textContent = msg.senderName;
                innerDiv.appendChild(nameDiv);
            }

            const textSpan = document.createElement('div');
            textSpan.textContent = msg.text;
            innerDiv.appendChild(textSpan);

            const metaDiv = document.createElement('div');
            metaDiv.className = 'msg-meta';
            const timeSpan = document.createElement('span');
            timeSpan.textContent = msg.time || new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            metaDiv.appendChild(timeSpan);

            if (isOut) {
                const statusSpan = document.createElement('span');
                statusSpan.innerHTML = '<i class="fas fa-check-double text-[10px]"></i>';
                metaDiv.appendChild(statusSpan);
            }

            innerDiv.appendChild(metaDiv);
            bubbleDiv.appendChild(innerDiv);
            chatContainer.appendChild(bubbleDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '' || !currentUser) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const messageData = {
                text: text,
                senderId: currentUser.uid,
                senderName: currentUser.displayName || currentUser.phoneNumber || currentUser.email || 'User',
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                time: timeStr
            };

            database.ref('messages').push(messageData)
                .catch((error) => {
                    console.error('Error sending message:', error);
                    alert('Dogoggora ergaa erguu: ' + error.message);
                });

            messageInput.value = '';
            messageInput.focus();
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ============================================================
        // SERVICE WORKER REGISTRATION (PWA installability)
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",()=>{})')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
